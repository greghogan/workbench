[package]
name = "workbench-rust-reference"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[lib]
name = "workbench_rust_reference"

[[bin]]
name = "rust-reference"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Restriction lints are selected individually because the full group contains conflicts.
dbg_macro = "deny"
expect_used = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
