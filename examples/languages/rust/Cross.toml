# Targets are selected by release profiles; never select another CPU architecture implicitly.
[build.env]
passthrough = ["CARGO_BUILD_JOBS", "RUST_TEST_THREADS"]

[target.x86_64-unknown-linux-musl]
dockerfile = "./Dockerfile.musl"
runner = "native"
image.name = "workbench-rust-musl:linux-x64"
image.toolchain = ["x86_64-unknown-linux-gnu"]

[target.aarch64-unknown-linux-musl]
dockerfile = "./Dockerfile.musl"
runner = "native"
image.name = "workbench-rust-musl:linux-arm64"
image.toolchain = ["aarch64-unknown-linux-gnu"]
