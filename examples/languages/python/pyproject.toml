[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-python-reference"
version = "0.1.0"
description = "Executable Python reference project for Workbench"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "mypy>=2.3.1,<3",
    "ruff>=0.16.5,<1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["A", "ARG", "B", "C4", "E", "F", "I", "PERF", "PIE", "RET", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["exhaustive-match", "ignore-without-code", "possibly-undefined"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
