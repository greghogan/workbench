name: Prepared Workbench runtime
description: Reuse the portable bundles built for this source revision.
inputs:
  artifact:
    description: Verified candidate artifact from this workflow run
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/runtime-candidate
    - shell: bash
      run: node scripts/ci-candidate.mts activate "$RUNNER_TEMP/runtime-candidate"
