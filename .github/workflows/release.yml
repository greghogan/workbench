name: Publish tested Workbench release
on:
  workflow_dispatch:
    inputs:
      checks_run:
        description: Successful complete main Checks run ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: workbench-release-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CHECKS_RUN: ${{ inputs.checks_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Promote the exact tested archive and verify published bytes
        run: node scripts/publish-release.mts "$CHECKS_RUN"
