name: Publish tested Workbench release
on:
  workflow_dispatch:
    inputs:
      checks_run:
        description: Successful complete main Checks run ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: workbench-release-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Prepare the release record writer
        run: |
          node scripts/setup-development.mjs --build-only
          node bin/workbench.mjs project add .
      - name: Promote the exact tested archive and verify published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_RUN: ${{ inputs.checks_run }}
        run: node scripts/publish-release.mts "$CHECKS_RUN" "$RUNNER_TEMP/workbench-release-assets"
      - name: Create the release record from verified downloads
        run: node scripts/publish-release.mts record "$RUNNER_TEMP/workbench-release-assets" "$RUNNER_TEMP/workbench-release-record"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workbench-release-record
          path: ${{ runner.temp }}/workbench-release-record/
          if-no-files-found: error
