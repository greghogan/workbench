name: Windows signature diagnosis
on:
  push:
    branches: [ci/windows-diagnostics-20261011]
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  WORKBENCH_CACHE_HOME: ${{ github.workspace }}/../tool-cache
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .node-version
      - name: Inspect verifier selection
        run: |
          where.exe gpg
          gpg --version
          node --version
      - name: Verify one signed Node installation
        run: node bin/workbench.mjs tools install --path . --tool node
