name: Combined native service qualification
on:
  push:
    branches: ["ci/tsk-3-macos-candidate-20261120"]

permissions:
  contents: read
  packages: read

env:
  GH_TOKEN: ${{ github.token }}
  ZSTD_CLEVEL: "9"

jobs:
  launchd-helper:
    name: Build universal macOS service launcher
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/launchd-helper.mts "$RUNNER_TEMP/launchd-helper"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launchd-helper-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/launchd-helper/
          if-no-files-found: error
          retention-days: 30

  windows-service-helper:
    name: Build native Windows service launcher
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - shell: pwsh
        run: node scripts/windows-service-helper.mts (Join-Path $env:RUNNER_TEMP windows-service-helper)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-service-helper-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-service-helper/workbench-scm.exe
            ${{ runner.temp }}/windows-service-helper/windows-service-helper.json
          if-no-files-found: error
          retention-days: 30

  candidate:
    name: Build portable Workbench candidate
    needs: [launchd-helper, windows-service-helper]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Prepare source dependencies and local bundles
        run: node scripts/setup-development.mjs --build-only
      - run: node bin/workbench.mjs project add .
      - name: Acquire the declared root toolchain
        run: node bin/workbench.mjs tools install --path .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: launchd-helper-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/launchd-helper/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-service-helper-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-service-helper/
      - name: Build the configured root release once
        env:
          WORKBENCH_LAUNCHD_HELPER_INPUT: ${{ runner.temp }}/launchd-helper
          WORKBENCH_WINDOWS_SERVICE_HELPER_INPUT: ${{ runner.temp }}/windows-service-helper
        run: |
          node bin/workbench.mjs check --role release --path . --environment native --no-cache
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {cpSync} from 'node:fs';
          import {join} from 'node:path';
          const paths=JSON.parse(execFileSync(process.execPath,['bin/workbench.mjs','paths','--path','.','--environment','native'],{encoding:'utf8'}));
          cpSync(join(paths.variables.WORKBENCH_DIST_DIR,'workbench-artifacts'),join(process.env.RUNNER_TEMP,'candidate/workbench-artifacts'),{recursive:true});
          JS
          node scripts/ci-candidate.mts record "$RUNNER_TEMP/candidate"
      - id: identity
        run: echo "artifact=workbench-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30

  platform-fixtures:
    name: Installed native services (${{ matrix.runner }})
    needs: candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure checkout text and symlinks
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/prepare-runtime
        with:
          artifact: ${{ needs.candidate.outputs.artifact }}
      - name: Qualify installed Linux services
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        timeout-minutes: 10
        env:
          GH_TOKEN: ""
        run: |
          bash scripts/check-linux-service.sh user "$RUNNER_TEMP/runtime-candidate/workbench-artifacts"
          bash scripts/check-linux-service.sh system "$RUNNER_TEMP/runtime-candidate/workbench-artifacts"
      - name: Qualify the installed macOS user service
        if: runner.os == 'macOS' && runner.environment == 'github-hosted'
        timeout-minutes: 5
        env:
          GH_TOKEN: ""
        run: bash scripts/check-macos-service.sh "$RUNNER_TEMP/runtime-candidate/workbench-artifacts"
      - name: Qualify the installed shared macOS service
        if: runner.os == 'macOS' && runner.environment == 'github-hosted'
        timeout-minutes: 5
        env:
          GH_TOKEN: ""
        run: bash scripts/check-macos-system-service.sh "$RUNNER_TEMP/runtime-candidate/workbench-artifacts"
      - name: Qualify the installed Windows services
        if: runner.os == 'Windows' && runner.environment == 'github-hosted' && runner.arch == 'X64'
        timeout-minutes: 12
        shell: pwsh
        env:
          GH_TOKEN: ""
        run: |
          $artifacts = Join-Path $env:RUNNER_TEMP runtime-candidate/workbench-artifacts
          $archive = Join-Path $artifacts workbench.tar.gz
          $checksum = (Get-Content -LiteralPath (Join-Path $artifacts SHA256SUMS) -Raw).Split(' ')[0]
          $node = (Get-Command node.exe).Source
          & scripts/check-windows-service.ps1 -Node $node -Archive $archive -Digest $checksum -ResumeWorker -IdleWorkers -Handoff
          & scripts/check-windows-service.ps1 -Node $node -Archive $archive -Digest $checksum -PrivateService
          & scripts/check-windows-service.ps1 -Node $node -Archive $archive -Digest $checksum -Recovery
      - name: Qualify Windows desktop Task Scheduler operation
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        env:
          GH_TOKEN: ""
        run: |
          $artifacts = Join-Path $env:RUNNER_TEMP runtime-candidate/workbench-artifacts
          $archive = Join-Path $artifacts workbench.tar.gz
          $checksum = (Get-Content -LiteralPath (Join-Path $artifacts SHA256SUMS) -Raw).Split(' ')[0]
          & scripts/check-windows-service.ps1 -Node (Get-Command node.exe).Source -Archive $archive -Digest $checksum -DesktopTask
