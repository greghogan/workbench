name: TSK-A native scope probes
on:
  push:
    branches: [ci/tsk-a-scope-probes]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash .github/probes/macos.sh
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./.github/probes/windows.ps1
