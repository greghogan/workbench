name: Native portability diagnostic

# Disposable verification lane; the complete Checks workflow remains authoritative.
on:
  push:
    branches: ["ci/msvc-probe-20261031"]

permissions:
  contents: read
  packages: read

env:
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  ports:
    name: Windows staged JS/TS and Unicode Ruby consumers
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Preserve canonical text and long paths
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Verify native path and environment regressions
        run: |
          node scripts/setup-development.mts
          node node_modules/vitest/vitest.mjs run tests/pnpm_storage.test.mts tests/local_environment.test.mts tests/dependencies.test.mts tests/windows_utf8_console.test.mts
      - name: Exercise packaged JS/TS commits and Ruby Unicode workflows
        if: ${{ success() }}
        run: |
          node bin/workbench.mjs tools install --path .
          node bin/workbench.mjs check --role integration --path . --environment native --no-cache
      - name: Retain consumer diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-consumer-diagnostic
          path: |
            coverage/probe-consumers/
            coverage/tests.json
          retention-days: 7

  php:
    name: macOS PHP consumer journeys
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          architecture: arm64
      - name: Prepare declared PHP host dependencies
        env:
          CHECK_ROOTS: '["examples/languages/php"]'
        run: node scripts/ci-native-prerequisites.mjs
      - name: Verify macOS path and environment regressions
        run: |
          node bin/workbench.mjs project add .
          node scripts/setup-development.mts
          node node_modules/vitest/vitest.mjs run tests/pnpm_storage.test.mts tests/local_environment.test.mts tests/dependencies.test.mts tests/windows_utf8_console.test.mts
      - name: Exercise packaged PHP installation and project adoption
        if: ${{ success() }}
        run: |
          node bin/workbench.mjs tools install --path .
          node bin/workbench.mjs check --role integration --path . --environment native --no-cache
      - name: Retain PHP consumer diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-php-diagnostic
          path: |
            coverage/probe-consumers/
            coverage/tests.json
          retention-days: 7
