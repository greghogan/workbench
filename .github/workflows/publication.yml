name: Verify registry publication

# Separate, explicit operation. Before the initial default-branch commit, pushing a
# deliberately named verification branch selects the same workflow as manual dispatch.
on:
  workflow_dispatch:
  push:
    branches: ["ci/publication-verification-**"]

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Verify ${{ matrix.kind }} ${{ matrix.builder }} image in GHCR
    runs-on: ${{ matrix.kind == 'release' && matrix.builder == 'guix' && 'ubuntu-24.04' || 'ubuntu-26.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: release, builder: nix }
          - { kind: release, builder: guix }
          - { kind: development, builder: native }
          - { kind: development, builder: nix }
          - { kind: development, builder: guix }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # A publication branch selects an already tested commit, rather than repeating its full matrix.
      - name: Require successful complete checks for this revision
        run: |
          verified_run=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/checks.yml" and .conclusion == "success")][0].id // error("Run successful complete Checks before selecting publication")')
          gh run download "$verified_run" --name ci-plan --dir "$RUNNER_TEMP/verified-plan"
          node --input-type=module - "$RUNNER_TEMP/verified-plan/workbench-ci-plan.json" <<'JS'
          import { readFileSync } from 'node:fs';
          import { readHostedPlan } from './scripts/ci-plan-contract.mjs';
          readHostedPlan(JSON.parse(readFileSync(process.argv[2], 'utf8')));
          JS
      - name: Make room for builder stores
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - name: Bootstrap Guix from its signed Ubuntu repository
        if: matrix.kind == 'release' && matrix.builder == 'guix'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y guix=1.4.0-6build1
          sudo systemctl start guix-daemon
          for key in /usr/share/guix/*.pub; do
            sudo sh -c 'guix archive --authorize < "$1"' authorize-key "$key"
          done
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare and verify the selected example image
        id: release
        if: matrix.kind == 'release'
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          profile="go-${BUILDER}-docker"
          node bin/workbench.mjs release prepare "$profile"
          node bin/workbench.mjs release prepare "$profile" --json > "$RUNNER_TEMP/release-plan.json"
          node --input-type=module - "$RUNNER_TEMP/release-plan.json" <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const plan = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `directory=${plan.profiles[0].output}\n`);
          JS

      # Offline development profiles need only Docker and the locked host CLI.
      # Their verification uses fresh source, networking disabled, and no host caches.
      - name: Prepare and verify the selected offline development image
        if: matrix.kind == 'development'
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          node bin/workbench.mjs tools install --devcontainer
          node bin/workbench.mjs development prepare "${BUILDER}"

      - name: Authenticate for this explicitly selected publication
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Publish, pull by digest, and verify image identity and behavior
        if: matrix.kind == 'release'
        env:
          BUILDER: ${{ matrix.builder }}
          WORKBENCH_RELEASE_ARTIFACT: ${{ steps.release.outputs.directory }}
        run: node scripts/ci-publish.mjs "$BUILDER"
      - name: Publish and verify the offline development image by registry digest
        if: matrix.kind == 'development'
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          tag="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          node bin/workbench.mjs development publish "${BUILDER}" \
            --image "ghcr.io/${repository}-dev-${BUILDER}:${tag}"
      - name: Remove transient credentials
        if: always()
        run: docker logout ghcr.io
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-${{ matrix.kind }}-${{ matrix.builder }}
          path: |
            ${{ runner.temp }}/publication-evidence/
            ~/.cache/workbench/offline-profiles/*/*.json
          if-no-files-found: ignore
          retention-days: 14
