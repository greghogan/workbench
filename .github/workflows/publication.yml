name: Prepare and publish artifact images

# Separate, explicit operation. These images must exist before Checks can use them.
# Workbench release publication remains in release.yml and requires successful Checks.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Image contents to prepare and publish
        type: choice
        options: [toolchain, development]
        default: toolchain
  push:
    branches: ["ci/publication-verification-**"]

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.builder }} ${{ matrix.architecture }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { builder: native, architecture: x64 }
          - { builder: nix, architecture: x64 }
          - { builder: guix, architecture: x64 }
          - { builder: native, architecture: arm64 }
          - { builder: nix, architecture: arm64 }
          - { builder: guix, architecture: arm64 }
    uses: ./.github/workflows/publish-image.yml
    with:
      kind: ${{ inputs.kind || 'toolchain' }}
      builder: ${{ matrix.builder }}
      architecture: ${{ matrix.architecture }}
