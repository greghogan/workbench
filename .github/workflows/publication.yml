name: Verify registry publication

# Separate, explicit operation. Before the initial default-branch commit, pushing a
# deliberately named verification branch selects the same workflow as manual dispatch.
on:
  workflow_dispatch:
  push:
    branches: ['ci/publication-verification-**']

permissions:
  contents: read
  actions: read
  packages: write

env:
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Verify ${{ matrix.builder }} image in GHCR
    runs-on: ${{ matrix.builder == 'guix' && 'ubuntu-24.04' || 'ubuntu-26.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        builder: [nix, guix]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
      # A publication branch selects an already tested commit, rather than repeating its full matrix.
      - name: Require successful complete checks for this revision
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
            --jq 'if any(.workflow_runs[]; .path == ".github/workflows/checks.yml" and .conclusion == "success") then "Checks passed for this revision" else error("Run successful complete Checks before selecting publication") end'
      - name: Make room for builder stores
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - name: Bootstrap Guix from its signed Ubuntu repository
        if: matrix.builder == 'guix'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y guix=1.4.0-6build1
          sudo systemctl start guix-daemon
          for key in /usr/share/guix/*.pub; do
            sudo sh -c 'guix archive --authorize < "$1"' authorize-key "$key"
          done
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare and verify the selected example image
        env:
          BUILDER: ${{ matrix.builder }}
        run: node bin/workbench.mjs release prepare "go-${BUILDER}-docker"
      - name: Authenticate for this explicitly selected publication
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Publish, pull by digest, and verify image identity and behavior
        env:
          BUILDER: ${{ matrix.builder }}
        run: node scripts/ci-publish.mjs "$BUILDER"
      - name: Remove transient credentials
        if: always()
        run: docker logout ghcr.io
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-${{ matrix.builder }}
          path: |
            ${{ runner.temp }}/publication-evidence/
            dist/releases/*/workbench-release.json
          if-no-files-found: ignore
          retention-days: 14
