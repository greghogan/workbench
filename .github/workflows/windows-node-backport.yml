name: Windows Node backport
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-node-backport-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows-node:
    name: Build Windows Node x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the verified Windows runtime
        shell: pwsh
        run: ./scripts/node-windows-backport/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/node-backport"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-node-backport
          path: ${{ runner.temp }}/node-backport/*.zip
          if-no-files-found: error
          compression-level: 0
  qualify:
    name: Qualify Windows Node in AppContainer
    needs: build-windows-node
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-node-backport
          path: ${{ runner.temp }}/node-backport
      - name: Verify the packaged runtime inside AppContainer
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem "$env:RUNNER_TEMP/node-backport/*.zip" -File)
          if ($archive.Count -ne 1) { throw 'Expected a single Node archive' }
          $runtime = "$env:RUNNER_TEMP/node-backport-verify"
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $runtime
          $node = @(Get-ChildItem $runtime -Recurse -Filter node.exe -File)
          if ($node.Count -ne 1) { throw 'Expected a single Node executable' }
          ./.github/probes/windows.ps1 -RuntimePath $node[0].FullName
  attest:
    name: Attest the qualified Windows Node archive
    needs: qualify
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-node-backport
          path: ${{ runner.temp }}/node-backport
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/node-backport/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-node-backport-attestation
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
