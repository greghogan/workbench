name: Windows Node backport
on:
  workflow_dispatch:
  push:
    branches: [ci/tsk-a-scope-probes]
    paths:
      - .github/workflows/windows-node-backport.yml
      - .github/probes/windows.ps1
      - scripts/node-windows-backport/**
permissions:
  contents: read
jobs:
  build-windows-node:
    name: Build and qualify Windows Node x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the verified Windows runtime
        shell: pwsh
        run: ./scripts/node-windows-backport/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/node-backport"
      - name: Verify the packaged runtime inside AppContainer
        shell: pwsh
        run: |
          $archive = Get-ChildItem "$env:RUNNER_TEMP/node-backport/*.zip"
          $runtime = "$env:RUNNER_TEMP/node-backport-verify"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $runtime
          $node = Get-ChildItem $runtime -Recurse -Filter node.exe
          ./.github/probes/windows.ps1 -RuntimePath $node.FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-node-backport
          path: ${{ runner.temp }}/node-backport/*.zip
          if-no-files-found: error
          compression-level: 0
