name: TSK-9 native archive qualification
on:
  push:
    branches: ["ci/tsk-9-native-archives-20261128"]
permissions:
  contents: read
concurrency:
  group: tsk-9-archive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Build portable candidate runtime
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Build the candidate runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/setup-development.mjs --build-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tsk-9-candidate-runtime
          path: bundle/
          if-no-files-found: error
          retention-days: 3
  qualify:
    needs: runtime
    name: Archive import / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, architecture: arm64 }
          - { runner: windows-2025, architecture: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.architecture }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tsk-9-candidate-runtime
          path: bundle/
      - name: Qualify offline native toolchain ZIP import
        run: node scripts/check-native-archive.mts
