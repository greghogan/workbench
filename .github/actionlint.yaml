# GitHub-hosted labels missing from native or managed actionlint versions:
# https://github.com/actions/runner-images#available-images
# This setting extends actionlint's known labels; it does not select self-hosted runners.
# Remove these entries when every selected actionlint release recognizes them.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
    - macos-26
