<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 689" role="img" aria-labelledby="title description">
  <title id="title">The Reviews page for Orchard Tools</title>
  <desc id="description">The Workflow sidebar shows 45 backlog plans, two tasks in Work, and four reviews in this scope. The Tools subproject links to its four reviews. Reviews first shows two tasks awaiting plan approval. The task with work paused for revised approval appears before the reopened task. The next section contains a task awaiting outcome acceptance with its related ADR, followed by a standalone ADR change. Each row links to the review where the developer can make the decision.</desc>
  <defs>
    <style>
      text{font-family:system-ui,sans-serif;fill:#1d2e44}
      .muted{fill:#52667e}
      .link{fill:#244f94;text-decoration:underline}
      .small{font-size:12px}
      .medium{font-size:14px}
      .heading{font-size:17px;font-weight:650}
      .title{font-size:23px;font-weight:700}
      .label{font-size:12px;font-weight:650}
      .mono{font-family:ui-monospace,monospace;font-size:12px}
      .card{fill:#fff;stroke:#c4cfdb}
      .selected{fill:#e6efff;stroke:#a6bbe2}
    </style>
  </defs>

  <rect width="1000" height="689" rx="16" fill="#edf2f7"/>
  <rect x="24" y="20" width="952" height="649" rx="12" fill="#f8fafc" stroke="#9baabd"/>
  <path d="M24 63h952M229 63v606" stroke="#becad8"/>
  <g fill="#73859b">
    <circle cx="44" cy="42" r="4"/><circle cx="58" cy="42" r="4"/><circle cx="72" cy="42" r="4"/>
  </g>
  <rect x="90" y="31" width="864" height="23" rx="5" fill="#e7edf6"/>
  <text class="mono muted" x="104" y="47">/projects/orchard/reviews?scope=orchard-tools</text>

  <g aria-label="Project and Workflow links">
    <text class="title" x="44" y="100">Workbench</text>
    <text class="label muted" x="44" y="133">PROJECT</text>
    <text class="medium" x="44" y="155">Orchard</text>
    <rect class="selected" x="40" y="165" width="174" height="30" rx="5"/>
    <text class="medium" x="58" y="185">Tools</text>
    <text class="label link" x="196" y="185" text-anchor="end">4</text>
    <text class="label muted" x="44" y="225">WORKFLOW</text>
    <text class="medium link" x="44" y="250">Plans</text><text class="small muted" x="196" y="250" text-anchor="end">45</text>
    <text class="medium link" x="44" y="278">Work</text><text class="small muted" x="196" y="278" text-anchor="end">2</text>
    <rect class="selected" x="40" y="288" width="174" height="30" rx="5"/>
    <text class="medium" x="44" y="307">Reviews</text><text class="label" x="196" y="307" text-anchor="end">4</text>
    <text class="label muted" x="44" y="348">RECORDS</text>
    <text class="medium link" x="44" y="373">Charters</text>
    <text class="medium link" x="44" y="401">Tasks</text>
  </g>

  <text class="small link" x="250" y="94">Orchard / Tools</text>
  <text class="title" x="250" y="127">Reviews</text>

  <g aria-label="Awaiting approval">
    <text class="heading" x="250" y="168">Awaiting approval</text>
    <rect class="card" x="250" y="181" width="701" height="66" rx="6"/>
    <text class="mono muted" x="267" y="207">TSK-8</text>
    <text class="medium link" x="329" y="207">Extend export validation</text>
    <text class="small muted" x="329" y="228">Work paused for revised approval</text>

    <rect class="card" x="250" y="254" width="701" height="66" rx="6"/>
    <text class="mono muted" x="267" y="280">TSK-2</text>
    <text class="medium link" x="329" y="280">Revise the queue export</text>
    <text class="small muted" x="329" y="301">Compare with the last accepted outcome</text>
  </g>

  <g aria-label="Awaiting acceptance">
    <text class="heading" x="250" y="368">Awaiting acceptance</text>
    <rect class="card" x="250" y="381" width="701" height="134" rx="6"/>
    <text class="mono muted" x="267" y="409">TSK-6</text>
    <text class="medium" x="329" y="409">Keep exported reports readable</text>
    <path d="M250 423h701M250 469h701" stroke="#c4cfdb"/>
    <text class="mono muted" x="267" y="451">ADR-2</text>
    <text class="medium link" x="329" y="451">Preserve export headings</text>
    <text class="small muted" x="933" y="451" text-anchor="end">Record change</text>
    <text class="medium link" x="329" y="497">Review outcome</text>

    <rect class="card" x="250" y="531" width="701" height="57" rx="6"/>
    <text class="mono muted" x="267" y="565">ADR-3</text>
    <text class="medium link" x="329" y="565">Keep error descriptions accessible</text>
    <text class="small muted" x="933" y="565" text-anchor="end">Record change</text>
  </g>
</svg>
