schema_version = 1

[[command]]
role = "format"
command = [ "node", "scripts/check.mjs", "format" ]

[[command]]
role = "lint"
command = [ "node", "scripts/check.mjs", "lint" ]

[[command]]
role = "test"
warn_seconds = 120
command = [ "node", "scripts/check.mjs", "test" ]

[command.coverage]
command = [ "node", "scripts/check.mjs", "coverage" ]
stages = [ "commit", "ci" ]
environments = [ "native" ]

[command.coverage.ci]
operating_systems = [ "linux" ]
architectures = [ "x64" ]
toolchain = false

[[command]]
role = "build"
command = [ "node", "scripts/check.mjs", "build" ]
stages = []

[[command]]
role = "docs"
command = [ "node", "{workbench}/bin/workbench.mjs", "docs", "README.md" ]

[[command]]
role = "release"
command = [ "node", "scripts/check.mjs", "release" ]
stages = []

[[command]]
role = "format-write"
command = [ "node", "scripts/check.mjs", "format-write" ]
stages = []

[[command]]
role = "clean"
command = [ "node", "{workbench}/scripts/clean.mjs", "build", "dist", "coverage" ]
stages = []

[[command]]
role = "distclean"
command = [ "node", "{workbench}/scripts/clean.mjs", "build", "dist", "coverage" ]
stages = []

[[command]]
role = "advisory"
requires_setup = false
online = true
command = [ "node", "{workbench}/bin/workbench.mjs", "advisories", "go" ]
stages = [ "ci" ]

[[command]]
role = "release-verify"
command = [ "node", "scripts/release-verify.mjs" ]
stages = []

[[command]]
name = "compatibility Go tests"
role = "compatibility-test"
command = ["node", "scripts/check.mjs", "test"]
stages = []
