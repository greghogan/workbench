schema_version = 1

[[command]]
role = "format"
command = [ "cargo", "fmt", "--all", "--check" ]

[[command]]
role = "lint"
command = [ "cargo", "clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings" ]

[[command]]
role = "test"
warn_seconds = 120
command = [ "cargo", "nextest", "run", "--all-targets", "--locked", "--no-fail-fast" ]

[command.coverage]
command = [ "node", "{workbench}/scripts/check-rust.mjs" ]
stages = [ "commit", "ci" ]
environments = [ "native" ]

[command.coverage.ci]
operating_systems = [ "linux" ]
architectures = [ "x64" ]
toolchain = false

[[command]]
role = "build"
command = [ "cargo", "build", "--locked" ]
stages = []

[[command]]
name = "doctests"
role = "docs"
command = [ "cargo", "test", "--doc", "--locked" ]

[[command]]
role = "docs"
command = [ "node", "{workbench}/bin/workbench.mjs", "docs", "README.md" ]

[[command]]
role = "release"
command = [ "node", "{workbench}/scripts/release-rust.mjs" ]
stages = []

[[command]]
role = "format-write"
command = [ "cargo", "fmt", "--all" ]
stages = []

[[command]]
role = "clean"
command = [ "node", "{workbench}/scripts/clean.mjs", "target", "dist", "coverage" ]
stages = []

[[command]]
role = "distclean"
command = [ "node", "{workbench}/scripts/clean.mjs", "target", "dist", "coverage" ]
stages = []

[[command]]
name = "miri portable"
role = "miri"
command = [ "node", "scripts/miri.mjs", "portable", "{workbench}" ]
stages = []
environment = "native"

[[command]]
name = "miri avx2"
role = "miri"
command = [ "node", "scripts/miri.mjs", "avx2", "{workbench}" ]
stages = []
environment = "native"


[[command]]
role = "advisory"
requires_setup = false
online = true
command = [ "node", "{workbench}/bin/workbench.mjs", "advisories", "rust" ]
stages = [ "ci" ]

[[command]]
role = "release-verify"
command = [ "node", "scripts/release-verify.mjs" ]
stages = []

[[command]]
name = "compatibility workspace tests"
role = "compatibility-test"
command = ["cargo", "test", "--workspace", "--all-targets", "--locked"]
stages = []

[[command]]
name = "compatibility doctests"
role = "compatibility-test"
command = ["cargo", "test", "--workspace", "--doc", "--locked"]
stages = []
