schema_version = 1

[targets.linux-x64]
platform = "linux-x64"

[targets.linux-arm64]
platform = "linux-arm64"

[targets.macos-arm64]
platform = "macos-arm64"

[targets.windows-x64]
platform = "windows-x64"

[recipes.native-tools]
owner = "workbench"
offline_profile = "native-toolchain"

[recipes.native-development]
owner = "workbench"
offline_profile = "native"

[recipes.nix-tools]
owner = "workbench"
offline_profile = "nix-toolchain"

[recipes.nix-development]
owner = "workbench"
offline_profile = "nix"

[recipes.guix-tools]
owner = "workbench"
offline_profile = "guix-toolchain"

[recipes.guix-development]
owner = "workbench"
offline_profile = "guix"

[recipes.workbench-release]
owner = "workbench-app"
inputs = ["LICENSE", "README.md", "package.json", "pnpm-lock.yaml", "app/src", "app/resources", "bin", "languages", "skills", "scripts"]
build = ["{node}", "{root}/scripts/package-workbench.mts", "--archive", "{artifact}"]
verify = ["{node}", "{root}/scripts/workbench-release-archive.mjs", "{artifact}"]
verify_inputs = ["scripts/workbench-release-archive.mjs", "app/src/core/distribution/release-archive.ts", "app/src/core/artifacts/release-directory.ts"]

[profiles.native]
builder = "native"
workspace = "host"
projects = ["workbench", "workbench-app"]
variants = [
  { target = "linux-x64", kind = "toolchain", recipe = "native-tools", formats = ["oci"] },
  { target = "linux-arm64", kind = "toolchain", recipe = "native-tools", formats = ["oci"] },
  { target = "linux-x64", kind = "development", recipe = "native-development", formats = ["oci"] },
  { target = "linux-arm64", kind = "development", recipe = "native-development", formats = ["oci"] },
  { target = "linux-x64", kind = "release", recipe = "workbench-release", formats = ["archive"] },
  { target = "linux-arm64", kind = "release", recipe = "workbench-release", formats = ["archive"] },
  { target = "macos-arm64", kind = "release", recipe = "workbench-release", formats = ["archive"] },
  { target = "windows-x64", kind = "release", recipe = "workbench-release", formats = ["archive"] },
]

[profiles.nix]
builder = "nix"
workspace = "host"
projects = ["workbench"]
variants = [
  { target = "linux-x64", kind = "toolchain", recipe = "nix-tools", formats = ["oci"] },
  { target = "linux-arm64", kind = "toolchain", recipe = "nix-tools", formats = ["oci"] },
  { target = "linux-x64", kind = "development", recipe = "nix-development", formats = ["oci"] },
  { target = "linux-arm64", kind = "development", recipe = "nix-development", formats = ["oci"] },
]

[profiles.guix]
builder = "guix"
workspace = "host"
projects = ["workbench"]
variants = [
  { target = "linux-x64", kind = "toolchain", recipe = "guix-tools", formats = ["oci"] },
  { target = "linux-arm64", kind = "toolchain", recipe = "guix-tools", formats = ["oci"] },
  { target = "linux-x64", kind = "development", recipe = "guix-development", formats = ["oci"] },
  { target = "linux-arm64", kind = "development", recipe = "guix-development", formats = ["oci"] },
]

# Packaging recipes for the individually owned example scopes.

[targets.linux-x64-musl]
platform = "linux-x64"
abi = "musl"

[targets.linux-arm64-musl]
platform = "linux-arm64"
abi = "musl"

[recipes.rust-linux-x64-musl]
owner = "workbench-rust"
inputs = ["LICENSE","examples/languages/rust","scripts/release-rust.mjs",".devcontainer/Dockerfile","workbench/profiles.toml"]
package = {}
build = ["{node}","{workbench}/scripts/release-rust.mjs","--target","x86_64-unknown-linux-musl","--image-profile","native"]
verify = ["{node}","{source}/scripts/release-verify.mjs","{artifact}","{source}"]

[recipes.rust-linux-arm64-musl]
owner = "workbench-rust"
inputs = ["LICENSE","examples/languages/rust","scripts/release-rust.mjs",".devcontainer/Dockerfile","workbench/profiles.toml"]
