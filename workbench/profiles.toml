build = ["{node}","{workbench}/scripts/release-rust.mjs","--target","aarch64-unknown-linux-musl","--image-profile","native"]
verify = ["{node}","{source}/scripts/release-verify.mjs","{artifact}","{source}"]

[recipes.go-native]
owner = "workbench-go"
inputs = ["LICENSE","examples/languages/go"]
package = {}
build = ["{node}","scripts/check.mjs","release"]
verify = ["{node}","{source}/scripts/release-verify.mjs","{artifact}","{source}"]

[recipes.go-nix-closure]
owner = "workbench-go"
inputs = ["LICENSE","examples/languages/go"]
package = {}
build = ["{node}","scripts/package-managed.mjs","nix-docker","closure","{nix_image}"]
verify = ["{node}","{source}/scripts/verify-managed.mjs","{artifact}","nix","closure","{nix_image}","{workbench}/.devcontainer/Dockerfile","{source}"]

[recipes.go-nix-portable]
owner = "workbench-go"
inputs = ["LICENSE","examples/languages/go",".devcontainer/Dockerfile"]
package = { file = "count.tar.gz" }
build = ["{node}","scripts/package-managed.mjs","nix-docker","portable","{nix_image}"]
