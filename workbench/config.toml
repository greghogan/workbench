# Hosted retention controls; verification is identical for cached and reacquired tools.
[ci.cache.artifacts]
llvm = "download"
clang = "download"
rust = "cache"
java = "download"
node = "download"
go = "download"
cmake = "download"
ninja = "download"
uv = "download"

# These selections work with tools install, shell, checks, and CI.
[[toolchains.profiles]]
name = "node-22"
paths = ["."]
tools.node = "22.23.4"

[[toolchains.profiles]]
name = "node-24"
paths = ["."]
tools.node = "24.22.1"

[[toolchains.profiles]]
name = "gcc"
paths = ["examples/languages/c", "examples/languages/cpp"]
compiler = "gcc"
platforms = ["linux-x64", "linux-arm64"]
