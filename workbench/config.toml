schema_version = 1

[bundle]
compression = "brotli"

[markdown]
wrap_width = 120

[checks]
environment = "native"
nix_docker_image = "nixos/nix@sha256:f159a58f390677f41e8e900a74b6e2f9c7f27b364122ae6acf7a652ce6c551c0"

[ci]
operating_systems = [ "linux", "macos", "windows" ]
environments = [ "guix", "nix" ]
toolchains = [ "node-22", "node-24", "gcc" ]

[ci.images]
native = "native"
nix = "nix"
guix = "guix"

[ci.architectures]
linux = [ "x64", "arm64" ]
macos = [ "arm64" ]
windows = [ "x64" ]

[compatibility]
required = false
data = "delete"

[commit]
style = "conventional"
subject_width = 50
body_width = 72

[citations]
library_dir = "library/citations"

[licenses]
allow = [ "MIT", "ISC", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "0BSD" ]

[development]
default = "native"

