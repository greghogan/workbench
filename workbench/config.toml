schema_version = 1

[execution]
cpus_per_job = 4

[bundle]
compression = "brotli"

[markdown]
wrap_width = 120

[checks]
environment = "native"
nix_docker_image = "nixos/nix@sha256:0d9c872db1ca2f3eaa4a095baa57ed9b72c09d53a0905a4428813f61f0ea98db"

[ci]
operating_systems = [ "linux", "macos", "windows" ]
environments = [ "guix", "nix" ]
toolchains = [ "node-22", "node-24", "gcc" ]

[ci.images]
native = "native-offline"
nix = "nix-offline"
guix = "guix-offline"

[ci.architectures]
linux = [ "x64", "arm64" ]
macos = [ "arm64" ]
windows = [ "x64" ]

[compatibility]
required = false

[commit]
style = "conventional"
subject_width = 50
body_width = 72

[citations]
library_dir = "library/citations"

[licenses]
allow = [ "MIT", "ISC", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "0BSD" ]

[development]
default = "native"

[[development.profiles]]
name = "native"
builder = "native"
workspace = "host"

[[development.profiles]]
name = "nix"
builder = "nix"
workspace = "host"

[[development.profiles]]
name = "guix"
builder = "guix"
workspace = "host"

[[development.profiles]]
name = "container"
builder = "native"
workspace = "devcontainer"
container_config = ".devcontainer/devcontainer.json"

[[development.profiles]]
name = "nix-container"
builder = "nix"
workspace = "devcontainer"
container_config = ".devcontainer/nix/devcontainer.json"

[[development.profiles]]
name = "guix-container"
builder = "guix"
workspace = "devcontainer"
container_config = ".devcontainer/guix/devcontainer.json"

