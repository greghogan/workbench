schema_version = 1

[bundle]
compression = "brotli"

[markdown]
wrap_width = 120

[checks]
environment = "native"
# Consumer integration acquires SDKs and upstream attestations through the GitHub API.
pass_environment = [
  "GH_TOKEN",
  "GITHUB_TOKEN",
  "WORKBENCH_EXTENDED_ARTIFACTS",
  "WORKBENCH_EXTENDED_DISPOSABLE_HOST",
  "WORKBENCH_WINDOWS_STARTUP_INPUTS",
]
nix_docker_image = "nixos/nix@sha256:746280551ddc1c72177d1a597c05eacac86dfaa18d5d649bf86411278bcd5470"

[ci]
operating_systems = [ "linux", "macos", "windows" ]
environments = [ "guix", "nix" ]
toolchains = [ "node-22", "node-24", "gcc", "mvsc" ]

[ci.images]
native = "native-toolchain"
nix = "nix-toolchain"
guix = "guix-toolchain"

[ci.architectures]
linux = [ "x64", "arm64" ]
macos = [ "arm64" ]
windows = [ "x64" ]

[compatibility]
required = false
data = "delete"

[review]
changes = true
tasks = true
task_approvals = true
signed_commits = true

[commit]
style = "conventional"
subject_width = 50
body_width = 72

[citations]
library_dir = "library/citations"

[licenses]
allow = [ "MIT", "ISC", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "0BSD" ]

[ci.cache.artifacts]
llvm = "download"
clang = "download"
rust = "cache"
java = "download"
node = "download"
go = "download"
cmake = "download"
ninja = "download"
uv = "download"

# These selections work with tools install, shell, checks, and CI.
[[toolchains.profiles]]
name = "node-22"
paths = ["."]
tools.node = "22.23.5"

[[toolchains.profiles]]
name = "node-24"
paths = ["."]
tools.node = "24.22.3"

[[toolchains.profiles]]
name = "gcc"
paths = ["examples/languages/c", "examples/languages/cpp"]
compiler = "gcc"
platforms = ["linux-x64", "linux-arm64"]

[[toolchains.profiles]]
name = "mvsc"
paths = ["examples/languages/c", "examples/languages/cpp"]
compiler = "mvsc"
platforms = ["windows-x64"]
