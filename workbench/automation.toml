# Agent-maintained commands and documentation wiring.

[input_groups.example-shared]
paths = [
  ".gitattributes",
  ".gitignore",
  ".node-version",
  ".tool-versions",
  "LICENSE",
  "Makefile",
  "app/src/core",
  "bin",
  "channels.scm",
  "docs",
  "flake.lock",
  "flake.nix",
  "languages",
  "scripts",
]

[input_groups.workbench-setup]
paths = [
  ".npmrc",
  ".pnpmfile.cjs",
  "app/resources",
  "app/src",
  "app/test",
  "examples/frameworks/react/scripts",
  "examples/languages/c/scripts",
  "examples/languages/cpp/scripts",
  "examples/languages/go/scripts",
  "examples/languages/java/scripts",
  "examples/languages/javascript/scripts",
  "examples/languages/php/scripts",
  "examples/languages/python/scripts",
  "examples/languages/ruby/scripts",
  "examples/languages/rust/scripts",
  "examples/languages/typescript/scripts",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "tsconfig.json",
]
depends_on = ["example-shared"]

[input_groups.workbench-tests]
paths = [
  ".devcontainer",
  ".dockerignore",
  ".envrc",
  ".githooks",
  ".github",
  ".prettierrc.json",
  "README.md",
  "app/workbench",
  "browser.nix",
  "browser.scm",
  "check-inputs.nix",
  "check-inputs.scm",
  "demo",
  "eslint.config.mjs",
  "eslint.config.mts",
  "examples/frameworks",
  "examples/languages/c",
  "examples/languages/cpp",
  "examples/languages/go/.envrc",
  "examples/languages/go/.gitignore",
  "examples/languages/go/.go-version",
  "examples/languages/go/LICENSE",
  "examples/languages/go/Makefile",
  "examples/languages/go/README.md",
  "examples/languages/go/check-inputs.nix",
  "examples/languages/go/check-inputs.scm",
  "examples/languages/go/cmd",
  "examples/languages/go/count_fuzz_test.go",
  "examples/languages/go/count_test.go",
  "examples/languages/go/flake.lock",
  "examples/languages/go/flake.nix",
  "examples/languages/go/go.mod",
  "examples/languages/go/go.sum",
  "examples/languages/go/managed-check-inputs.json",
  "examples/languages/go/managed-extra-inputs.json",
  "examples/languages/go/manifest.scm",
  "examples/languages/go/package.scm",
  "examples/languages/go/release-manifest.scm",
  "examples/languages/go/workbench",
  "examples/languages/java",
  "examples/languages/javascript",
  "examples/languages/php",
  "examples/languages/python",
  "examples/languages/ruby",
  "examples/languages/rust",
  "examples/languages/typescript",
  "managed-bootstrap.json",
  "managed-check-inputs.json",
  "managed-registry.json.br",
  "manifest.scm",
  "skills",
  "vitest.config.mts",
  "workbench",
]
depends_on = ["workbench-setup"]

[input_groups.example-typescript]
paths = ["examples/languages/typescript"]
depends_on = ["example-shared"]

[input_groups.example-rust]
paths = ["examples/languages/rust"]
depends_on = ["example-shared"]

[input_groups.example-react]
paths = ["examples/frameworks/react"]
depends_on = ["example-shared"]

[input_groups.example-python]
paths = ["examples/languages/python"]
outputs = ["examples/languages/python/src/workbench_python_reference.egg-info"]
depends_on = ["example-shared"]

[input_groups.example-c]
paths = ["examples/languages/c"]
depends_on = ["example-shared"]

[input_groups.example-cpp]
paths = ["examples/languages/cpp"]
depends_on = ["example-shared"]

[input_groups.example-go]
paths = ["examples/languages/go"]
depends_on = ["example-shared"]

[input_groups.example-javascript]
paths = ["examples/languages/javascript"]
depends_on = ["example-shared"]

[input_groups.example-java]
paths = ["examples/languages/java"]
depends_on = ["example-shared"]

[input_groups.example-ruby]
paths = ["examples/languages/ruby"]
depends_on = ["example-shared"]

[input_groups.example-php]
paths = ["examples/languages/php"]
depends_on = ["example-shared"]

[[check]]
name = "c reference PGO qualification"
path = "examples/languages/c"
role = "pgo-qualification"
command = [ "node", "scripts/check.mjs", "pgo", "{workbench}" ]
stages = [ "ci" ]
[check.ci]
operating_systems = [ "linux" ]
architectures = [ "x64" ]
environments = [ "native" ]

[[check]]
name = "cpp reference PGO qualification"
path = "examples/languages/cpp"
role = "pgo-qualification"
command = [ "node", "scripts/check.mjs", "pgo", "{workbench}" ]
stages = [ "ci" ]
[check.ci]
operating_systems = [ "linux" ]
architectures = [ "x64" ]
environments = [ "native" ]

[[check]]
name = "go reference PGO qualification"
path = "examples/languages/go"
role = "pgo-qualification"
command = [ "node", "{workbench}/scripts/check-pgo.mjs", "go" ]
stages = [ "ci" ]
[check.ci]
operating_systems = [ "linux" ]
architectures = [ "x64" ]
environments = [ "native" ]

[[check]]
name = "rust reference PGO qualification"
path = "examples/languages/rust"
role = "pgo-qualification"
command = [ "node", "{workbench}/scripts/check-pgo.mjs", "rust" ]
stages = [ "ci" ]
[check.ci]
operating_systems = [ "linux" ]
architectures = [ "x64" ]
environments = [ "native" ]

[[check]]
name = "Independent Workbench rebuilds"
path = "."
role = "reproducibility"
command = [ "node", "scripts/check-reproducibility.mjs" ]
extended = true

[[check]]
name = "Workbench profiling cases"
path = "."
role = "profile"
command = [ "node", "scripts/profile-workbench.mjs" ]
stages = []

[[check]]
name = "Targeted mutation and partial-failure checks"
path = "."
role = "mutation"
command = [ "node", "scripts/check-mutations.mjs" ]
extended = true

[[check]]
name = "Generated-input exploration"
path = "."
role = "fuzz"
command = [ "node", "scripts/check-fuzz.mjs" ]
extended = true

[[check]]
name = "Managed Nix store preparation"
path = "."
role = "managed-store"
command = [ "node", "scripts/verify-managed-preparation.mjs", "nix", "--store", "managed" ]
extended = true

[check.ci]
operating_systems = [ "linux" ]
environments = [ "native" ]

[[check]]
name = "Managed Guix store preparation"
path = "."
role = "managed-store"
command = [ "node", "scripts/verify-managed-preparation.mjs", "guix", "--store", "managed" ]
extended = true

[check.ci]
operating_systems = [ "linux" ]
environments = [ "native" ]

[[check]]
name = "Native installed services"
path = "."
role = "installed-services"
command = [ "node", "scripts/check-installed-services.mts" ]
extended = true
requires_setup = false

[check.ci]
operating_systems = [ "linux", "macos" ]
environments = [ "native" ]

[[check]]
name = "Native installed services (Windows x64)"
path = "."
role = "installed-services"
command = [ "node", "scripts/check-installed-services.mts" ]
extended = true
requires_setup = false

[check.ci]
operating_systems = [ "windows" ]
architectures = [ "x64" ]
environments = [ "native" ]

[[check]]
name = "Windows startup in a disposable guest"
path = "."
role = "windows-startup"
command = [ "node", "scripts/check-windows-startup-vm.mts" ]
extended = true
requires_setup = false

[check.ci]
operating_systems = [ "linux" ]
architectures = [ "x64" ]
environments = [ "native" ]

[[check]]
name = "Development dependencies and tooling"
role = "setup"
input_groups = ["workbench-setup"]
project = "workbench"
command = [ "node", "scripts/setup-development.mts", "--reuse-prepared" ]

[[check]]
name = "TypeScript format"
ci.toolchain = false
role = "format"
project = "workbench"
command = [ "{packageManager}", "run", "format:check" ]

[[check]]
name = "TypeScript lint"
ci.toolchain = false
role = "lint"
project = "workbench"
command = [ "{packageManager}", "run", "lint" ]

[[check]]
name = "TypeScript types"
ci.toolchain = false
role = "type"
project = "workbench"
command = [ "{packageManager}", "run", "typecheck" ]

[[check]]
name = "Bundle parity and license policy"
ci.toolchain = false
role = "license"
project = "workbench"
command = [ "{packageManager}", "run", "bundle:check" ]

[[check]]
name = "Workbench validation"
ci.toolchain = false
role = "lint"
project = "workbench"
command = [ "node", "bin/workbench.mjs", "validate", "." ]

[[check]]
name = "TypeScript tests"
role = "test"
warn_seconds = 120
input_groups = ["workbench-tests"]
project = "workbench"
command = [ "node", "node_modules/vitest/vitest.mjs", "run", "--configLoader", "native" ]

[check.coverage]
command = [ "node", "scripts/test-coverage.mjs" ]
stages = [ "commit", "ci" ]
environments = [ "native" ]

[check.coverage.ci]
operating_systems = [ "linux" ]
architectures = [ "x64" ]
toolchain = false

[[check]]
name = "Shell format"
ci.toolchain = false
role = "format"
project = "workbench"
command = [ "scripts/check-shell", "format" ]

[[check]]
name = "Shell lint"
ci.toolchain = false
role = "lint"
project = "workbench"
command = [ "scripts/check-shell", "lint" ]

[[check]]
name = "GitHub workflow validation"
ci.toolchain = false
role = "lint"
project = "workbench"
command = [ "node", "scripts/check-workflows.mts" ]

[[check]]
name = "Workbench README examples"
ci.toolchain = false
role = "docs"
project = "workbench"
command = [ "node", "bin/workbench.mjs", "docs", "README.md" ]

[[check]]
name = "Workbench build"
