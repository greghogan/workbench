        <tspan x="73" dy="14">commit-file inspection.</tspan>
        <tspan x="73" dy="23">Reuse bounded immutable blob previews and syntax highlighting.</tspan>
        <tspan x="73" dy="14">Read paired file versions and limit historical metadata reads.</tspan>
